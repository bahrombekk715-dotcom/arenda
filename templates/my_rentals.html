<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mening Ijaralarim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .header p {
            color: #b3b3b3;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .rental-card {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .rental-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .rental-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.3);
        }

        .rental-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .rental-title {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .rental-date {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .scooter-image-box {
            width: 100%;
            height: 180px;
            border-radius: 15px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #2c2c3e 0%, #3a3a4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .scooter-image-box:hover { opacity: 0.85; }

        .scooter-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .scooter-svg-placeholder {
            width: 140px;
            height: 140px;
        }

        .info-section {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .info-row:last-child { margin-bottom: 0; }

        .info-label {
            color: #888;
            font-size: 14px;
        }

        .info-value {
            color: #00d4ff;
            font-size: 16px;
            font-weight: bold;
        }

        .payment-section {
            background: rgba(0, 255, 136, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .payment-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #00ff88;
        }

        .payment-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .payment-stat {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .payment-stat-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .payment-stat-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        .payment-history {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            opacity: 0.3;
        }

        .empty-state-text {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .empty-state-sub {
            color: #444;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ====== LIGHTBOX ====== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .lightbox.active { display: flex; }

        .lightbox-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
            z-index: 3001;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .lightbox-content img,
        .lightbox-content video {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-title {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mening Ijaralarim</h1>
        <p>Skuterlar va to'lovlar tarixi</p>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Yuklanmoqda...</p>
        </div>
        <div id="rentals-container" style="display: none;"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
                            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.3"/>
                        </linearGradient>
                    </defs>
                    <circle cx="30" cy="95" r="14" fill="none" stroke="url(#emptyGrad)" stroke-width="3"/>
                    <circle cx="95" cy="95" r="14" fill="none" stroke="url(#emptyGrad)" stroke-width="3"/>
                    <path d="M30 95 L40 55 L50 50 L55 45" stroke="url(#emptyGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M40 55 L85 55 L95 95" stroke="url(#emptyGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M55 45 L55 25" stroke="url(#emptyGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M48 25 L62 25" stroke="url(#emptyGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="empty-state-text">Ijaralar yo'q</div>
            <div class="empty-state-sub">Sizda hali ijara yo'q</div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
        <div id="lightboxContent" onclick="event.stopPropagation()"></div>
        <div class="lightbox-title" id="lightboxTitle"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = {{ user_id or 'null' }};

        const SCOOTER_COLORS = [
            { main: '#00d4ff', accent: '#0099cc' },
            { main: '#00ff88', accent: '#00cc6a' },
            { main: '#ff6b6b', accent: '#cc5555' },
            { main: '#ffd93d', accent: '#ccae31' },
            { main: '#c084fc', accent: '#9966cc' },
            { main: '#ff8a5c', accent: '#cc6e4a' },
        ];

        function getScooterSVG(index) {
            const c = SCOOTER_COLORS[index % SCOOTER_COLORS.length];
            return `
            <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" class="scooter-svg-placeholder">
                <defs>
                    <linearGradient id="sg${index}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${c.main}"/>
                        <stop offset="100%" style="stop-color:${c.accent}"/>
                    </linearGradient>
                    <filter id="glow${index}">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>
                <!-- Orqa g'ildirak -->
                <circle cx="45" cy="130" r="22" fill="none" stroke="url(#sg${index})" stroke-width="5"/>
                <circle cx="45" cy="130" r="6" fill="url(#sg${index})"/>
                <!-- Oldingi g'ildirak -->
                <circle cx="158" cy="130" r="22" fill="none" stroke="url(#sg${index})" stroke-width="5"/>
                <circle cx="158" cy="130" r="6" fill="url(#sg${index})"/>
                <!-- Rama -->
                <path d="M45 130 L60 75 L75 68 L82 58" stroke="url(#sg${index})" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow${index})"/>
                <!-- Platforma -->
                <path d="M60 75 L140 75 L158 130" stroke="url(#sg${index})" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Rul ustuni -->
                <path d="M82 58 L82 28" stroke="url(#sg${index})" stroke-width="7" fill="none" stroke-linecap="round"/>
                <!-- Rul -->
                <path d="M68 28 L96 28" stroke="url(#sg${index})" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Dek yuzasi -->
                <rect x="65" y="70" width="70" height="10" rx="5" fill="${c.main}" opacity="0.15"/>
                <!-- Farola -->
                <circle cx="82" cy="22" r="3" fill="${c.main}" opacity="0.8"/>
                <!-- Batareya ko'rsatgich -->
                <rect x="95" y="62" width="30" height="16" rx="4" fill="rgba(255,255,255,0.05)" stroke="url(#sg${index})" stroke-width="2"/>
                <rect x="98" y="65" width="20" height="10" rx="2" fill="url(#sg${index})" opacity="0.4"/>
            </svg>`;
        }

        async function loadRentals() {
            try {
                const response = await fetch('/api/my-rentals?user_id=' + userId);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.rentals.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                const container = document.getElementById('rentals-container');
                container.style.display = 'block';

                data.rentals.forEach((rental, index) => {
                    const card = createRentalCard(rental, index);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading rentals:', error);
                document.getElementById('loading').innerHTML = '<p style="color: #ff4444;">Yuklanishda xatolik</p>';
            }
        }

        function createRentalCard(rental, index) {
            const card = document.createElement('div');
            card.className = 'rental-card';

            const imageHtml = rental.scooter_image
                ? `<img src="${rental.scooter_image}" alt="${rental.scooter_name}">`
                : getScooterSVG(index);

            const clickAttr = rental.scooter_image
                ? `onclick="openLightbox('${rental.scooter_image}', '${rental.scooter_name}')"`
                : '';

            let paymentsHistoryHtml = '';
            if (rental.payments && rental.payments.length > 0) {
                paymentsHistoryHtml = `
                    <div class="payment-history">
                        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">To'lovlar tarixi:</div>
                        ${rental.payments.map(p => `
                            <div class="payment-item">
                                <span style="color: #888;">${formatDate(p.payment_date)}</span>
                                <span style="color: #00ff88; font-weight: 600;">${formatPrice(p.amount)} so'm</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Deadline va qarz info
            let deadlineHtml = '';
            if (rental.status === 'active') {
                const overdueDays = rental.overdue_days || 0;
                const debtAmount = rental.debt_amount || 0;
                const paidUntil = rental.paid_until;
                const nextPayment = rental.next_payment_date;

                if (overdueDays > 0) {
                    deadlineHtml = `
                        <div style="background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px;">
                            <div style="color: #ff4444; font-weight: bold; font-size: 16px; margin-bottom: 10px;">
                                ⚠️ TO'LOV KECHIKKAN!
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 5px;">Kechikkan kunlar</div>
                                    <div style="color: #ff4444; font-size: 22px; font-weight: bold;">${overdueDays} kun</div>
                                </div>
                                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 5px;">Qarz summasi</div>
                                    <div style="color: #ff4444; font-size: 22px; font-weight: bold;">${formatPrice(debtAmount)}</div>
                                </div>
                            </div>
                            <div style="color: #ff8888; font-size: 13px; margin-top: 10px; text-align: center;">
                                Iltimos, tezda to'lovni amalga oshiring!
                            </div>
                        </div>
                    `;
                } else if (paidUntil) {
                    const paidUntilDate = new Date(paidUntil);
                    const now = new Date();
                    const daysLeft = Math.ceil((paidUntilDate - now) / (1000 * 60 * 60 * 24));

                    let bgColor, borderColor, textColor, icon;
                    if (daysLeft <= 2) {
                        bgColor = 'rgba(255, 200, 0, 0.1)';
                        borderColor = 'rgba(255, 200, 0, 0.3)';
                        textColor = '#ffc800';
                        icon = '⏰';
                    } else {
                        bgColor = 'rgba(0, 255, 136, 0.05)';
                        borderColor = 'rgba(0, 255, 136, 0.2)';
                        textColor = '#00ff88';
                        icon = '✅';
                    }

                    deadlineHtml = `
                        <div style="background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 12px; padding: 15px; margin-bottom: 15px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 5px;">${icon} Pulingiz yetadi</div>
                                    <div style="color: ${textColor}; font-size: 16px; font-weight: bold;">${formatDate(paidUntil)}</div>
                                </div>
                                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 5px;">Qolgan kunlar</div>
                                    <div style="color: ${textColor}; font-size: 22px; font-weight: bold;">${daysLeft} kun</div>
                                </div>
                            </div>
                            <div style="color: #888; font-size: 13px; margin-top: 10px; text-align: center;">
                                Keyingi to'lov: <b style="color: ${textColor}">${formatDate(nextPayment)}</b>
                            </div>
                        </div>
                    `;
                }
            }

            const statusBadge = rental.status === 'active'
                ? (rental.overdue_days > 0
                    ? '<div class="status-badge" style="background: rgba(255,68,68,0.2); color: #ff4444; border-color: rgba(255,68,68,0.3);">Qarz</div>'
                    : '<div class="status-badge">Faol</div>')
                : '<div class="status-badge" style="background: rgba(136,136,136,0.2); color: #888; border-color: rgba(136,136,136,0.3);">Tugagan</div>';

            card.innerHTML = `
                <div class="rental-header">
                    <div>
                        <div class="rental-title">${rental.scooter_name}</div>
                        <div class="rental-date">Boshlangan: ${formatDate(rental.start_date)}</div>
                    </div>
                    ${statusBadge}
                </div>

                <div class="scooter-image-box" ${clickAttr}>${imageHtml}</div>

                ${deadlineHtml}

                <div class="info-section">
                    <div class="info-row">
                        <span class="info-label">Haftalik to'lov:</span>
                        <span class="info-value">${formatPrice(rental.weekly_payment)} so'm</span>
                    </div>
                </div>

                <div class="payment-section">
                    <div class="payment-title">To'lovlar</div>
                    <div class="payment-stats">
                        <div class="payment-stat">
                            <div class="payment-stat-label">Jami to'langan</div>
                            <div class="payment-stat-value" style="color: #00ff88;">${formatPrice(rental.total_paid || 0)}</div>
                        </div>
                        <div class="payment-stat">
                            <div class="payment-stat-label">To'lovlar soni</div>
                            <div class="payment-stat-value" style="color: #00d4ff;">${rental.payments ? rental.payments.length : 0}</div>
                        </div>
                    </div>
                    ${paymentsHistoryHtml}
                </div>
            `;

            return card;
        }

        // ====== LIGHTBOX ======
        function openLightbox(src, title) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightboxContent').innerHTML =
                `<img src="${src}" style="max-width:95vw;max-height:85vh;object-fit:contain;border-radius:8px;" onclick="event.stopPropagation()">`;
            document.getElementById('lightboxTitle').textContent = title || '';
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightboxContent').innerHTML = '';
            document.body.style.overflow = '';
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('uz-UZ').format(price);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('uz-UZ', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        loadRentals();
    </script>
</body>
</html>
