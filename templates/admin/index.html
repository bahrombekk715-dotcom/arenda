<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .tab.active {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            color: #000;
            border-color: transparent;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-card {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 0, 0, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: block;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: #00ff88;
        }

        .file-preview-img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        /* ====== PROGRESS OVERLAY ====== */
        .progress-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .progress-overlay.active { display: flex; }

        .progress-box {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 24px;
            padding: 40px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .progress-scooter {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            animation: scooterBounce 1.5s ease-in-out infinite;
        }

        @keyframes scooterBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .progress-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-percent {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-status {
            color: #888;
            font-size: 13px;
            margin-top: 8px;
        }

        /* ====== RENTAL LIST ====== */
        .rental-list {
            display: grid;
            gap: 15px;
        }

        .rental-item {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .rental-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .rental-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .rental-item-title {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }

        .rental-item-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            color: #888;
        }

        /* ====== DETAIL MODAL ====== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(0, 212, 255, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        .modal-close:hover { color: #fff; }

        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .image-preview:hover { opacity: 0.85; }

        .video-preview {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
        }

        .info-grid {
            display: grid;
            gap: 12px;
            margin: 15px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .info-row-label {
            color: #888;
            font-size: 14px;
        }

        .info-row-value {
            color: #00d4ff;
            font-weight: 600;
        }

        /* ====== LIGHTBOX ====== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .lightbox.active { display: flex; }

        .lightbox-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
            z-index: 3001;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .lightbox-content {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox video {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 8px;
        }

        .lightbox-title {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 212, 255, 0.95);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 4000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Panel</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('create')">Ijara yaratish</div>
            <div class="tab" onclick="switchTab('list')">Barcha ijaralar</div>
            <div class="tab" onclick="switchTab('overdue')">Kechikkanlar</div>
            <div class="tab" onclick="switchTab('payment')">To'lov kiritish</div>
        </div>

        <!-- Ijara yaratish -->
        <div id="tab-create" class="tab-content active">
            <div class="form-card">
                <div class="form-title">Yangi ijara yaratish</div>

                <form id="createForm">
                    <div class="form-group">
                        <label class="form-label">Telegram ID yoki Telefon</label>
                        <input type="text" class="form-input" id="userId" placeholder="123456789 yoki +998901234567" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Ism</label>
                            <input type="text" class="form-input" id="firstName" placeholder="Ism" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Familiya</label>
                            <input type="text" class="form-input" id="lastName" placeholder="Familiya" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Skuter nomi</label>
                        <input type="text" class="form-input" id="scooterName" placeholder="Masalan: Ninebot Max G30" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Haftalik to'lov (so'm)</label>
                        <input type="number" class="form-input" id="weeklyPayment" placeholder="100000" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Skuter rasmi (ixtiyoriy)</label>
                        <div class="file-upload">
                            <input type="file" id="scooterImage" accept="image/*" onchange="previewFile('scooterImage', 'scooterPreview')">
                            <label class="file-upload-label">
                                Rasm tanlash
                            </label>
                        </div>
                        <div id="scooterPreview"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Pasport rasmi</label>
                        <div class="file-upload">
                            <input type="file" id="passportImage" accept="image/*" required onchange="previewFile('passportImage', 'passportPreview')">
                            <label class="file-upload-label">
                                Pasport tanlash
                            </label>
                        </div>
                        <div id="passportPreview"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Video</label>
                        <div class="file-upload">
                            <input type="file" id="videoFile" accept="video/*" required onchange="previewFile('videoFile', 'videoPreview')">
                            <label class="file-upload-label">
                                Video tanlash
                            </label>
                        </div>
                        <div id="videoPreview"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">Ijarani yaratish</button>
                </form>
            </div>
        </div>

        <!-- Barcha ijaralar -->
        <div id="tab-list" class="tab-content">
            <div class="loading" id="listLoading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Yuklanmoqda...</p>
            </div>
            <div id="rentalsList" class="rental-list" style="display: none;"></div>
        </div>

        <!-- Kechikkan to'lovlar -->
        <div id="tab-overdue" class="tab-content">
            <div class="loading" id="overdueLoading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Yuklanmoqda...</p>
            </div>
            <div id="overdueList" class="rental-list" style="display: none;"></div>
        </div>

        <!-- To'lov kiritish -->
        <div id="tab-payment" class="tab-content">
            <div class="form-card">
                <div class="form-title">To'lov kiritish</div>

                <form id="paymentForm">
                    <div class="form-group">
                        <label class="form-label">Telegram ID yoki Telefon</label>
                        <input type="text" class="form-input" id="paymentUserId" placeholder="123456789" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">To'lov summasi (so'm)</label>
                        <input type="number" class="form-input" id="paymentAmount" placeholder="100000" required>
                    </div>

                    <button type="submit" class="btn btn-primary">To'lovni kiritish</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Ijara tafsilotlari</div>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Progress Overlay -->
    <div id="progressOverlay" class="progress-overlay">
        <div class="progress-box">
            <div class="progress-scooter">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00d4ff"/>
                            <stop offset="100%" style="stop-color:#00ff88"/>
                        </linearGradient>
                    </defs>
                    <circle cx="30" cy="95" r="14" fill="none" stroke="url(#scGrad)" stroke-width="4"/>
                    <circle cx="30" cy="95" r="4" fill="url(#scGrad)"/>
                    <circle cx="95" cy="95" r="14" fill="none" stroke="url(#scGrad)" stroke-width="4"/>
                    <circle cx="95" cy="95" r="4" fill="url(#scGrad)"/>
                    <path d="M30 95 L40 55 L50 50 L55 45" stroke="url(#scGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M40 55 L85 55 L95 95" stroke="url(#scGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M55 45 L55 25" stroke="url(#scGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <path d="M48 25 L62 25" stroke="url(#scGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <rect x="60" y="48" width="20" height="12" rx="3" fill="rgba(0,212,255,0.2)" stroke="url(#scGrad)" stroke-width="2"/>
                </svg>
            </div>
            <div class="progress-title">Ijara yaratilmoqda...</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
            <div class="progress-status" id="progressStatus">Ma'lumotlar tayyorlanmoqda...</div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
        <div id="lightboxContent" onclick="event.stopPropagation()"></div>
        <div class="lightbox-title" id="lightboxTitle"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
            if (tabName === 'list') loadRentals();
            if (tabName === 'overdue') loadOverdueRentals();
        }

        function previewFile(inputId, previewId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const file = input.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `
                        <div class="file-preview">
                            <img src="${e.target.result}" class="file-preview-img">
                            <div style="margin-top:6px">${file.name}</div>
                        </div>`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = `<div class="file-preview">${file.name}</div>`;
            }
        }

        // ====== PROGRESS BAR ======
        function showProgress() {
            document.getElementById('progressOverlay').classList.add('active');
        }

        function hideProgress() {
            document.getElementById('progressOverlay').classList.remove('active');
        }

        function updateProgress(percent, status) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = Math.round(percent) + '%';
            if (status) document.getElementById('progressStatus').textContent = status;
        }

        async function animateProgress(start, end, duration, status) {
            return new Promise(resolve => {
                if (status) updateProgress(start, status);
                const startTime = Date.now();
                function step() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const current = start + (end - start) * progress;
                    updateProgress(current, status);
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        resolve();
                    }
                }
                requestAnimationFrame(step);
            });
        }

        // ====== IJARA YARATISH ======
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('user_id', document.getElementById('userId').value);
            formData.append('scooter_name', document.getElementById('scooterName').value);
            formData.append('weekly_payment', document.getElementById('weeklyPayment').value);

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            formData.append('full_name', firstName + ' ' + lastName);

            const scooterImage = document.getElementById('scooterImage').files[0];
            const passportImage = document.getElementById('passportImage').files[0];
            const videoFile = document.getElementById('videoFile').files[0];

            if (scooterImage) formData.append('scooter_image', scooterImage);
            if (passportImage) formData.append('passport_image', passportImage);
            if (videoFile) formData.append('video_file', videoFile);

            showProgress();
            updateProgress(0, "Ma'lumotlar tayyorlanmoqda...");

            try {
                await animateProgress(0, 15, 400, "Ma'lumotlar tayyorlanmoqda...");
                await animateProgress(15, 35, 500, "Fayllar yuklanmoqda...");

                const xhr = new XMLHttpRequest();
                const uploadPromise = new Promise((resolve, reject) => {
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const filePercent = (e.loaded / e.total) * 45;
                            updateProgress(35 + filePercent, "Fayllar yuklanmoqda...");
                        }
                    });

                    xhr.addEventListener('load', () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve(JSON.parse(xhr.responseText));
                        } else {
                            try {
                                reject(JSON.parse(xhr.responseText));
                            } catch {
                                reject({ message: 'Server xatoligi' });
                            }
                        }
                    });

                    xhr.addEventListener('error', () => reject({ message: 'Tarmoq xatoligi' }));
                    xhr.open('POST', '/api/admin/create-rental');
                    xhr.send(formData);
                });

                await animateProgress(80, 90, 300, "Bazaga yozilmoqda...");
                const result = await uploadPromise;
                await animateProgress(90, 100, 400, "Tayyor!");

                setTimeout(() => {
                    hideProgress();
                    if (result.success) {
                        showToast('Ijara muvaffaqiyatli yaratildi!');
                        document.getElementById('createForm').reset();
                        document.querySelectorAll('[id$="Preview"]').forEach(el => el.innerHTML = '');
                    } else {
                        showToast(result.message);
                    }
                }, 500);

            } catch (error) {
                hideProgress();
                showToast(error.message || 'Xatolik yuz berdi');
            }
        });

        // ====== TO'LOV ======
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                user_id: document.getElementById('paymentUserId').value,
                amount: parseFloat(document.getElementById('paymentAmount').value)
            };

            try {
                const response = await fetch('/api/admin/add-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showToast('To\'lov muvaffaqiyatli kiritildi!');
                    document.getElementById('paymentForm').reset();
                } else {
                    showToast(result.message);
                }
            } catch (error) {
                showToast('Xatolik yuz berdi');
            }
        });

        // ====== IJARALAR RO'YXATI ======
        async function loadRentals() {
            try {
                const response = await fetch('/api/admin/active-rentals');
                const rentals = await response.json();

                document.getElementById('listLoading').style.display = 'none';
                const container = document.getElementById('rentalsList');
                container.style.display = 'grid';

                if (rentals.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666;">Ijaralar yo\'q</p>';
                    return;
                }

                container.innerHTML = rentals.map(r => {
                    const overdueDays = r.overdue_days || 0;
                    const debtAmount = r.debt_amount || 0;
                    const paidUntil = r.paid_until;

                    let statusBadge = '';
                    let statusInfo = '';

                    if (overdueDays > 0) {
                        statusBadge = `<div style="padding: 4px 10px; background: rgba(255,68,68,0.2); color: #ff4444; border-radius: 8px; font-size: 12px; font-weight: bold;">🚨 ${overdueDays} kun kechikkan</div>`;
                        statusInfo = `<div style="color: #ff4444; font-size: 13px;">Qarz: ${formatPrice(debtAmount)} so'm</div>`;
                    } else if (paidUntil) {
                        const paidDate = new Date(paidUntil);
                        const now = new Date();
                        const daysLeft = Math.ceil((paidDate - now) / (1000 * 60 * 60 * 24));

                        if (daysLeft <= 3) {
                            statusBadge = `<div style="padding: 4px 10px; background: rgba(255,200,0,0.2); color: #ffc800; border-radius: 8px; font-size: 12px; font-weight: bold;">⏰ ${daysLeft} kun qoldi</div>`;
                            statusInfo = `<div style="color: #ffc800; font-size: 13px;">To'lov: ${formatDate(paidUntil)}</div>`;
                        } else {
                            statusBadge = `<div style="padding: 4px 10px; background: rgba(0,255,136,0.2); color: #00ff88; border-radius: 8px; font-size: 12px; font-weight: bold;">✅ ${daysLeft} kun</div>`;
                            statusInfo = `<div style="color: #00ff88; font-size: 13px;">To'lov: ${formatDate(paidUntil)}</div>`;
                        }
                    }

                    return `
                        <div class="rental-item" onclick="showRentalDetails(${r.id})">
                            <div class="rental-item-header">
                                <div class="rental-item-title">${r.scooter_name}</div>
                                ${statusBadge}
                            </div>
                            <div class="rental-item-info">
                                <div><b>${r.full_name}</b></div>
                                <div>${r.phone || '—'}</div>
                                <div>${formatPrice(r.weekly_payment)}/hafta</div>
                                ${statusInfo}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading rentals:', error);
            }
        }

        // ====== KECHIKKAN TO'LOVLAR ======
        async function loadOverdueRentals() {
            try {
                const response = await fetch('/api/admin/overdue-rentals');
                const rentals = await response.json();

                document.getElementById('overdueLoading').style.display = 'none';
                const container = document.getElementById('overdueList');
                container.style.display = 'grid';

                if (rentals.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #00ff88; font-size: 18px; padding: 40px;">✅ Kechikkan to\'lovlar yo\'q!</p>';
                    return;
                }

                container.innerHTML = rentals.map(r => {
                    const overdueDays = r.overdue_days || 0;
                    const debtAmount = r.debt_amount || 0;

                    return `
                        <div class="rental-item" onclick="showRentalDetails(${r.id})" style="border: 2px solid rgba(255,68,68,0.3);">
                            <div class="rental-item-header">
                                <div class="rental-item-title">${r.scooter_name}</div>
                                <div style="padding: 6px 12px; background: rgba(255,68,68,0.2); color: #ff4444; border-radius: 10px; font-size: 14px; font-weight: bold;">
                                    🚨 ${overdueDays} kun
                                </div>
                            </div>
                            <div style="margin: 12px 0;">
                                <div style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px;">${r.full_name}</div>
                                <div style="font-size: 14px; color: #888;">${r.phone || '—'}</div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;">
                                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 4px;">Qarz summasi</div>
                                    <div style="color: #ff4444; font-size: 18px; font-weight: bold;">${formatPrice(debtAmount)}</div>
                                </div>
                                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: center;">
                                    <div style="color: #888; font-size: 12px; margin-bottom: 4px;">Haftalik to'lov</div>
                                    <div style="color: #00d4ff; font-size: 18px; font-weight: bold;">${formatPrice(r.weekly_payment)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading overdue rentals:', error);
            }
        }

        // ====== IJARA TAFSILOTLARI + LIGHTBOX ======
        async function showRentalDetails(rentalId) {
            try {
                const [detailResponse, paymentInfoResponse] = await Promise.all([
                    fetch('/api/admin/rental/' + rentalId),
                    fetch('/api/admin/rental/' + rentalId + '/payment-info')
                ]);

                const data = await detailResponse.json();
                const paymentInfo = await paymentInfoResponse.json();

                const rental = data.rental;
                const docs = data.documents;
                const payments = data.payments;

                // To'lov holati bloki
                let paymentStatusHtml = '';
                if (paymentInfo && !paymentInfo.error) {
                    const overdueDays = paymentInfo.overdue_days || 0;
                    const debtAmount = paymentInfo.debt_amount || 0;
                    const paidUntil = paymentInfo.paid_until;

                    if (overdueDays > 0) {
                        paymentStatusHtml = `
                            <div style="background: rgba(255, 68, 68, 0.1); border: 2px solid rgba(255, 68, 68, 0.3); border-radius: 15px; padding: 20px; margin-bottom: 20px;">
                                <h3 style="color: #ff4444; margin-bottom: 15px; font-size: 18px;">🚨 TO'LOV KECHIKKAN!</h3>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                                        <div style="color: #888; font-size: 13px; margin-bottom: 6px;">Kechikkan kunlar</div>
                                        <div style="color: #ff4444; font-size: 28px; font-weight: bold;">${overdueDays} kun</div>
                                    </div>
                                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                                        <div style="color: #888; font-size: 13px; margin-bottom: 6px;">Qarz summasi</div>
                                        <div style="color: #ff4444; font-size: 28px; font-weight: bold;">${formatPrice(debtAmount)}</div>
                                    </div>
                                </div>
                                <div style="color: #ff8888; font-size: 14px; margin-top: 15px; text-align: center;">
                                    Har kuni ${formatPrice(paymentInfo.daily_rate)} so'mdan qarz oshib bormoqda
                                </div>
                            </div>
                        `;
                    } else if (paidUntil) {
                        const paidDate = new Date(paidUntil);
                        const now = new Date();
                        const daysLeft = Math.ceil((paidDate - now) / (1000 * 60 * 60 * 24));

                        let bgColor, borderColor, textColor, icon;
                        if (daysLeft <= 2) {
                            bgColor = 'rgba(255, 200, 0, 0.1)';
                            borderColor = 'rgba(255, 200, 0, 0.3)';
                            textColor = '#ffc800';
                            icon = '⏰';
                        } else {
                            bgColor = 'rgba(0, 255, 136, 0.05)';
                            borderColor = 'rgba(0, 255, 136, 0.2)';
                            textColor = '#00ff88';
                            icon = '✅';
                        }

                        paymentStatusHtml = `
                            <div style="background: ${bgColor}; border: 2px solid ${borderColor}; border-radius: 15px; padding: 20px; margin-bottom: 20px;">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                                        <div style="color: #888; font-size: 13px; margin-bottom: 6px;">${icon} Pulingiz yetadi</div>
                                        <div style="color: ${textColor}; font-size: 18px; font-weight: bold;">${paymentInfo.paid_until_formatted}</div>
                                    </div>
                                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                                        <div style="color: #888; font-size: 13px; margin-bottom: 6px;">Qolgan kunlar</div>
                                        <div style="color: ${textColor}; font-size: 28px; font-weight: bold;">${daysLeft} kun</div>
                                    </div>
                                </div>
                                <div style="color: #888; font-size: 14px; margin-top: 15px; text-align: center;">
                                    Keyingi to'lov sanasi: <b style="color: ${textColor}">${paymentInfo.next_payment_formatted}</b>
                                </div>
                            </div>
                        `;
                    }
                }

                let paymentsHtml = '';
                if (payments.length > 0) {
                    const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
                    paymentsHtml = `
                        <h3 style="color: #00ff88; margin-top: 20px; margin-bottom: 10px;">To'lovlar tarixi</h3>
                        <div style="background: rgba(0,255,136,0.05); padding: 15px; border-radius: 12px; margin-bottom: 12px;">
                            <div style="text-align: center;">
                                <div style="color: #888; font-size: 13px; margin-bottom: 5px;">Jami to'langan</div>
                                <div style="color: #00ff88; font-size: 26px; font-weight: bold;">${formatPrice(totalPaid)} so'm</div>
                            </div>
                        </div>
                        ${payments.map(p => `
                            <div class="info-row">
                                <span class="info-row-label">${formatDate(p.payment_date)}</span>
                                <span class="info-row-value">${formatPrice(p.amount)} so'm</span>
                            </div>
                        `).join('')}
                    `;
                }

                document.getElementById('modalBody').innerHTML = `
                    ${paymentStatusHtml}

                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-row-label">Mijoz:</span>
                            <span class="info-row-value">${rental.full_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">Telefon:</span>
                            <span class="info-row-value">${rental.phone || '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">Skuter:</span>
                            <span class="info-row-value">${rental.scooter_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">Haftalik:</span>
                            <span class="info-row-value">${formatPrice(rental.weekly_payment)} so'm</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">Boshlangan:</span>
                            <span class="info-row-value">${formatDate(rental.start_date)}</span>
                        </div>
                    </div>

                    ${rental.scooter_image ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">Skuter rasmi</h3>
                        <img src="${rental.scooter_image}" class="image-preview" onclick="openLightbox('${rental.scooter_image}', 'Skuter rasmi')">
                    ` : ''}

                    ${docs && docs.passport_image ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">Pasport</h3>
                        <img src="${docs.passport_image}" class="image-preview" onclick="openLightbox('${docs.passport_image}', 'Pasport')">
                    ` : ''}

                    ${docs && docs.video_file ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">Video</h3>
                        <video class="video-preview" onclick="openLightboxVideo('${docs.video_file}', 'Video')" poster="">
                            <source src="${docs.video_file}" type="video/mp4">
                        </video>
                        <div style="text-align:center;margin-top:6px;color:#888;font-size:12px;">Kattalashtirish uchun bosing</div>
                    ` : ''}

                    ${paymentsHtml}

                    ${rental.status === 'active' ? `
                        <div style="margin-top: 25px; display: grid; gap: 12px;">
                            <button onclick="editWeeklyPayment(${rental.id}, ${rental.weekly_payment})" class="btn btn-primary" style="background: linear-gradient(135deg, #ffc800 0%, #ff8800 100%);">
                                ✏️ Haftalik to'lovni tahrirlash
                            </button>
                            <button onclick="completeRental(${rental.id}, '${rental.scooter_name}')" class="btn btn-primary" style="background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);">
                                ✅ Skuter topshirildi
                            </button>
                        </div>
                    ` : ''}
                `;

                document.getElementById('modal').classList.add('active');
            } catch (error) {
                showToast('Xatolik yuz berdi');
            }
        }

        // ====== LIGHTBOX FUNCTIONS ======
        function openLightbox(src, title) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightboxContent').innerHTML =
                `<img src="${src}" class="lightbox-content" onclick="event.stopPropagation()">`;
            document.getElementById('lightboxTitle').textContent = title || '';
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openLightboxVideo(src, title) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightboxContent').innerHTML =
                `<video controls autoplay class="lightbox-content" onclick="event.stopPropagation()">
                    <source src="${src}" type="video/mp4">
                </video>`;
            document.getElementById('lightboxTitle').textContent = title || '';
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('active');
            document.getElementById('lightboxContent').innerHTML = '';
            document.body.style.overflow = '';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('uz-UZ').format(price);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('uz-UZ', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // ====== HAFTALIK TO'LOVNI TAHRIRLASH ======
        function editWeeklyPayment(rentalId, currentAmount) {
            const newAmount = prompt(`Yangi haftalik to'lov summasini kiriting:\n\nHozirgi: ${formatPrice(currentAmount)} so'm`, currentAmount);

            if (!newAmount || newAmount === currentAmount.toString()) return;

            const amount = parseFloat(newAmount);
            if (isNaN(amount) || amount <= 0) {
                showToast('Noto\'g\'ri summa kiritildi');
                return;
            }

            fetch('/api/admin/update-weekly-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rental_id: rentalId, amount: amount })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Haftalik to\'lov muvaffaqiyatli o\'zgartirildi!');
                    closeModal();
                    if (document.getElementById('tab-list').classList.contains('active')) {
                        loadRentals();
                    }
                    if (document.getElementById('tab-overdue').classList.contains('active')) {
                        loadOverdueRentals();
                    }
                } else {
                    showToast(result.message || 'Xatolik yuz berdi');
                }
            })
            .catch(error => {
                showToast('Xatolik yuz berdi');
            });
        }

        // ====== SKUTER TOPSHIRILDI ======
        function completeRental(rentalId, scooterName) {
            const confirmed = confirm('Skuter topshirilganini tasdiqlaysizmi?\n\nSkuter: ' + scooterName + '\n\nDIQQAT: Barcha ma\'lumotlar va fayllar o\'chib ketadi!\nBu amalni qaytarib bo\'lmaydi!');

            if (!confirmed) {
                return;
            }

            console.log('Complete rental started:', rentalId);
            closeModal();
            showProgress();
            updateProgress(10, 'Boshlandi...');

            // API so'rovini yuborish
            fetch('/api/admin/complete-rental', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rental_id: rentalId })
            })
            .then(response => {
                console.log('Response received:', response.status);
                updateProgress(50, 'Ma\'lumotlar tozalanmoqda...');
                return response.json();
            })
            .then(result => {
                console.log('Result:', result);
                updateProgress(100, 'Tayyor!');

                setTimeout(() => {
                    hideProgress();

                    if (result.success) {
                        showSuccessModal(scooterName);

                        // Ro'yxatni yangilash
                        setTimeout(() => {
                            if (document.getElementById('tab-list').classList.contains('active')) {
                                loadRentals();
                            }
                            if (document.getElementById('tab-overdue').classList.contains('active')) {
                                loadOverdueRentals();
                            }
                        }, 1000);
                    } else {
                        showToast(result.message || 'Xatolik yuz berdi');
                    }
                }, 500);
            })
            .catch(error => {
                console.error('Complete rental error:', error);
                hideProgress();
                showToast('Xatolik yuz berdi: ' + error.message);
            });
        }

        function showSuccessModal(scooterName) {
            const successDiv = document.createElement('div');
            successDiv.id = 'successModal';
            successDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:5000;display:flex;align-items:center;justify-content:center;';

            const modalContent = document.createElement('div');
            modalContent.style.cssText = 'background:linear-gradient(135deg,#1e1e2f 0%,#2a2a3e 100%);border-radius:30px;padding:50px 40px;text-align:center;max-width:400px;border:2px solid rgba(0,255,136,0.3);box-shadow:0 20px 80px rgba(0,0,0,0.8);';

            const checkmark = document.createElement('div');
            checkmark.style.cssText = 'width:100px;height:100px;margin:0 auto 25px;background:linear-gradient(135deg,#00ff88 0%,#00cc6a 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 10px 40px rgba(0,255,136,0.4);color:#000;font-weight:bold;';
            checkmark.innerHTML = '&#10003;';

            const title = document.createElement('h2');
            title.style.cssText = 'font-size:28px;font-weight:800;background:linear-gradient(135deg,#00ff88 0%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px;';
            title.textContent = 'Muvaffaqiyatli yakunlandi!';

            const scooterText = document.createElement('p');
            scooterText.style.cssText = 'color:#888;font-size:16px;margin-bottom:10px;';
            scooterText.innerHTML = '<b style="color:#00d4ff;">' + scooterName + '</b>';

            const descText = document.createElement('p');
            descText.style.cssText = 'color:#666;font-size:14px;line-height:1.6;';
            descText.innerHTML = 'Skuter topshirildi<br>Barcha ma\'lumotlar tozalandi';

            const okButton = document.createElement('button');
            okButton.textContent = 'OK';
            okButton.style.cssText = 'margin-top:30px;padding:15px 40px;background:linear-gradient(135deg,#00ff88 0%,#00cc6a 100%);border:none;border-radius:12px;color:#000;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 5px 20px rgba(0,255,136,0.3);';
            okButton.onclick = function() {
                successDiv.remove();
            };

            modalContent.appendChild(checkmark);
            modalContent.appendChild(title);
            modalContent.appendChild(scooterText);
            modalContent.appendChild(descText);
            modalContent.appendChild(okButton);
            successDiv.appendChild(modalContent);

            document.body.appendChild(successDiv);

            setTimeout(() => {
                if (document.getElementById('successModal')) {
                    successDiv.remove();
                }
            }, 5000);
        }
    </script>
</body>
</html>
