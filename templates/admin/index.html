<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍💼 Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .tab.active {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            color: #000;
            border-color: transparent;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-card {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 0, 0, 0.4);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: block;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: #00ff88;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .rental-list {
            display: grid;
            gap: 15px;
        }

        .rental-item {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .rental-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .rental-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .rental-item-title {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }

        .rental-item-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-preview {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .info-grid {
            display: grid;
            gap: 12px;
            margin: 15px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .info-row-label {
            color: #888;
            font-size: 14px;
        }

        .info-row-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 212, 255, 0.95);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 2000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍💼 Admin Panel</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('create')">➕ Ijara yaratish</div>
            <div class="tab" onclick="switchTab('list')">📋 Barcha ijaralar</div>
            <div class="tab" onclick="switchTab('payment')">💰 To'lov kiritish</div>
        </div>

        <!-- Ijara yaratish -->
        <div id="tab-create" class="tab-content active">
            <div class="form-card">
                <div class="form-title">➕ Yangi ijara yaratish</div>

                <form id="createForm">
                    <div class="form-group">
                        <label class="form-label">User Telegram ID yoki Telefon raqami</label>
                        <input type="text" class="form-input" id="userId" placeholder="123456789 yoki +998901234567" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Skuter nomi</label>
                        <input type="text" class="form-input" id="scooterName" placeholder="Masalan: Ninebot Max G30" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Haftalik to'lov (so'm)</label>
                        <input type="number" class="form-input" id="weeklyPayment" placeholder="100000" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Skuter rasmi (ixtiyoriy)</label>
                        <div class="file-upload">
                            <input type="file" id="scooterImage" accept="image/*" onchange="previewFile('scooterImage', 'scooterPreview')">
                            <label class="file-upload-label">
                                📸 Rasm tanlash
                            </label>
                        </div>
                        <div id="scooterPreview"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Pasport rasmi</label>
                        <div class="file-upload">
                            <input type="file" id="passportImage" accept="image/*" required onchange="previewFile('passportImage', 'passportPreview')">
                            <label class="file-upload-label">
                                📄 Pasport tanlash
                            </label>
                        </div>
                        <div id="passportPreview"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Video</label>
                        <div class="file-upload">
                            <input type="file" id="videoFile" accept="video/*" required onchange="previewFile('videoFile', 'videoPreview')">
                            <label class="file-upload-label">
                                🎥 Video tanlash
                            </label>
                        </div>
                        <div id="videoPreview"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">✅ Ijarani yaratish</button>
                </form>
            </div>
        </div>

        <!-- Barcha ijaralar -->
        <div id="tab-list" class="tab-content">
            <div class="loading" id="listLoading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Yuklanmoqda...</p>
            </div>
            <div id="rentalsList" class="rental-list" style="display: none;"></div>
        </div>

        <!-- To'lov kiritish -->
        <div id="tab-payment" class="tab-content">
            <div class="form-card">
                <div class="form-title">💰 To'lov kiritish</div>

                <form id="paymentForm">
                    <div class="form-group">
                        <label class="form-label">User Telegram ID yoki Telefon raqami</label>
                        <input type="text" class="form-input" id="paymentUserId" placeholder="123456789" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">To'lov summasi (so'm)</label>
                        <input type="number" class="form-input" id="paymentAmount" placeholder="100000" required>
                    </div>

                    <button type="submit" class="btn btn-primary">💰 To'lovni kiritish</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Ijara tafsilotlari</div>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');

            // Load data if needed
            if (tabName === 'list') {
                loadRentals();
            }
        }

        function previewFile(inputId, previewId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const file = input.files[0];

            if (file) {
                preview.innerHTML = `<div class="file-preview">✅ ${file.name}</div>`;
            }
        }

        // Ijara yaratish
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('user_id', document.getElementById('userId').value);
            formData.append('scooter_name', document.getElementById('scooterName').value);
            formData.append('weekly_payment', document.getElementById('weeklyPayment').value);

            const scooterImage = document.getElementById('scooterImage').files[0];
            const passportImage = document.getElementById('passportImage').files[0];
            const videoFile = document.getElementById('videoFile').files[0];

            if (scooterImage) formData.append('scooter_image', scooterImage);
            if (passportImage) formData.append('passport_image', passportImage);
            if (videoFile) formData.append('video_file', videoFile);

            try {
                const response = await fetch('/api/admin/create-rental', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showToast('✅ Ijara muvaffaqiyatli yaratildi!');
                    document.getElementById('createForm').reset();
                    document.querySelectorAll('[id$="Preview"]').forEach(el => el.innerHTML = '');
                } else {
                    showToast('❌ ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Xatolik yuz berdi');
            }
        });

        // To'lov kiritish
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                user_id: document.getElementById('paymentUserId').value,
                amount: parseFloat(document.getElementById('paymentAmount').value)
            };

            try {
                const response = await fetch('/api/admin/add-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showToast('✅ To\'lov muvaffaqiyatli kiritildi!');
                    document.getElementById('paymentForm').reset();
                } else {
                    showToast('❌ ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Xatolik yuz berdi');
            }
        });

        // Ijaralar ro'yxatini yuklash
        async function loadRentals() {
            try {
                const response = await fetch('/api/admin/rentals');
                const rentals = await response.json();

                document.getElementById('listLoading').style.display = 'none';
                const container = document.getElementById('rentalsList');
                container.style.display = 'grid';

                if (rentals.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666;">Ijaralar yo\'q</p>';
                    return;
                }

                container.innerHTML = rentals.map(r => `
                    <div class="rental-item" onclick="showRentalDetails(${r.id})">
                        <div class="rental-item-header">
                            <div class="rental-item-title">🛴 ${r.scooter_name}</div>
                        </div>
                        <div class="rental-item-info">
                            <div>👤 ${r.full_name}</div>
                            <div>📅 ${formatDate(r.start_date)}</div>
                            <div>💰 ${formatPrice(r.weekly_payment)}/hafta</div>
                            <div>📱 ${r.phone || '—'}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading rentals:', error);
            }
        }

        // Ijara tafsilotlarini ko'rsatish
        async function showRentalDetails(rentalId) {
            try {
                const response = await fetch('/api/admin/rental/' + rentalId);
                const data = await response.json();

                const rental = data.rental;
                const docs = data.documents;
                const payments = data.payments;

                let paymentsHtml = '';
                if (payments.length > 0) {
                    paymentsHtml = `
                        <h3 style="color: #00ff88; margin-top: 20px; margin-bottom: 10px;">💰 To'lovlar tarixi</h3>
                        ${payments.map(p => `
                            <div class="info-row">
                                <span class="info-row-label">${formatDate(p.payment_date)}</span>
                                <span class="info-row-value">${formatPrice(p.amount)} so'm</span>
                            </div>
                        `).join('')}
                    `;
                }

                document.getElementById('modalBody').innerHTML = `
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-row-label">👤 Mijoz:</span>
                            <span class="info-row-value">${rental.full_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">📱 Telefon:</span>
                            <span class="info-row-value">${rental.phone || '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">🛴 Skuter:</span>
                            <span class="info-row-value">${rental.scooter_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">💰 Haftalik:</span>
                            <span class="info-row-value">${formatPrice(rental.weekly_payment)} so'm</span>
                        </div>
                        <div class="info-row">
                            <span class="info-row-label">📅 Boshlangan:</span>
                            <span class="info-row-value">${formatDate(rental.start_date)}</span>
                        </div>
                    </div>

                    ${rental.scooter_image ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">🛴 Skuter rasmi</h3>
                        <img src="${rental.scooter_image}" class="image-preview">
                    ` : ''}

                    ${docs && docs.passport_image ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">📄 Pasport</h3>
                        <img src="${docs.passport_image}" class="image-preview">
                    ` : ''}

                    ${docs && docs.video_file ? `
                        <h3 style="color: #00d4ff; margin-top: 20px; margin-bottom: 10px;">🎥 Video</h3>
                        <video controls class="video-preview">
                            <source src="${docs.video_file}" type="video/mp4">
                        </video>
                    ` : ''}

                    ${paymentsHtml}
                `;

                document.getElementById('modal').classList.add('active');
            } catch (error) {
                console.error('Error loading rental details:', error);
                showToast('❌ Xatolik yuz berdi');
            }
        }

        function closeModal(event) {
            if (!event || event.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('uz-UZ').format(price);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('uz-UZ', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
    </script>
</body>
</html>
