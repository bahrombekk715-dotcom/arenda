<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛴 Skuter Ijarasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .header p {
            color: #b3b3b3;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .scooter-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .scooter-card {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .scooter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scooter-card:hover::before {
            opacity: 1;
        }

        .scooter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .scooter-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #2c2c3e 0%, #3a3a4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .scooter-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .scooter-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .scooter-model {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .price-section {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .price-row:last-child {
            margin-bottom: 0;
        }

        .price-label {
            color: #b3b3b3;
            font-size: 14px;
        }

        .price-value {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .rent-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rent-btn.weekly {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
        }

        .rent-btn.monthly {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
        }

        .rent-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .rent-btn:active {
            transform: scale(0.98);
        }

        .rent-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state-text {
            color: #666;
            font-size: 18px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-available {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-rented {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛴 Skuter Ijarasi</h1>
        <p>Zamonaviy va qulay skuterlar</p>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Yuklanmoqda...</p>
        </div>
        <div id="scooter-grid" class="scooter-grid" style="display: none;"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">🛴</div>
            <div class="empty-state-text">Hozircha skuterlar yo'q</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = {{ user_id or 'null' }};

        async function loadScooters() {
            try {
                const response = await fetch('/api/scooters');
                const scooters = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (scooters.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                const grid = document.getElementById('scooter-grid');
                grid.style.display = 'grid';

                scooters.forEach(scooter => {
                    const card = createScooterCard(scooter);
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading scooters:', error);
                document.getElementById('loading').innerHTML = '<p style="color: #ff4444;">❌ Yuklanishda xatolik</p>';
            }
        }

        function createScooterCard(scooter) {
            const card = document.createElement('div');
            card.className = 'scooter-card';

            const statusClass = scooter.status === 'available' ? 'status-available' : 'status-rented';
            const statusText = scooter.status === 'available' ? '✅ Mavjud' : '🔴 Band';

            const imageHtml = scooter.image_url
                ? `<img src="${scooter.image_url}" alt="${scooter.name}">`
                : '🛴';

            card.innerHTML = `
                <div class="status-badge ${statusClass}">${statusText}</div>
                <div class="scooter-image">${imageHtml}</div>
                <div class="scooter-name">${scooter.name}</div>
                <div class="scooter-model">Model: ${scooter.model}</div>

                <div class="price-section">
                    <div class="price-row">
                        <span class="price-label">📅 Haftalik:</span>
                        <span class="price-value">${formatPrice(scooter.price_weekly)} so'm</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label">📆 Oylik:</span>
                        <span class="price-value">${formatPrice(scooter.price_monthly)} so'm</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="rent-btn weekly" onclick="rentScooter(${scooter.id}, 'weekly')" ${scooter.status !== 'available' ? 'disabled' : ''}>
                        📅 Haftalik
                    </button>
                    <button class="rent-btn monthly" onclick="rentScooter(${scooter.id}, 'monthly')" ${scooter.status !== 'available' ? 'disabled' : ''}>
                        📆 Oylik
                    </button>
                </div>
            `;

            return card;
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('uz-UZ').format(price);
        }

        async function rentScooter(scooterId, rentalType) {
            if (!userId) {
                tg.showAlert('❌ Xatolik: User ID topilmadi');
                return;
            }

            try {
                const response = await fetch('/api/rent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        scooter_id: scooterId,
                        rental_type: rentalType
                    })
                });

                const result = await response.json();

                if (result.success) {
                    tg.showAlert('✅ ' + result.message);
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    tg.showAlert('❌ ' + result.message);
                }
            } catch (error) {
                console.error('Rent error:', error);
                tg.showAlert('❌ Xatolik yuz berdi');
            }
        }

        // Load scooters on page load
        loadScooters();
    </script>
</body>
</html>
